{% extends "core/base.html" %}
{% load static %}

{% block title %}Contact — The Opening{% endblock %}

{% block content %}

<!-- Hero -->
<section class="hero hero--page hero--short">
    <div class="hero__overlay hero__overlay--solid"></div>
    <div class="hero__content">
        <h1 class="display-h hero__title">Contact</h1>
        <p class="hero__subtitle">Begin the conversation</p>
    </div>
</section>

<!-- Contact Form & Details -->
<section class="section section--contact">
    <div class="section__inner">
        <div class="contact-grid">

            <form class="contact-form" method="post" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_name" class="sr-only">Name</label>
                    <input type="text" name="name" id="id_name" placeholder="Your name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="id_email" class="sr-only">Email</label>
                    <input type="email" name="email" id="id_email" placeholder="Your email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="id_subject" class="sr-only">Subject</label>
                    <input type="text" name="subject" id="id_subject" placeholder="Subject" required>
                </div>

                <div class="form-group">
                    <label for="id_message" class="sr-only">Message</label>
                    <textarea name="message" id="id_message" placeholder="Your message" rows="5" required></textarea>
                </div>

                <button type="submit" class="form-submit">Send Message</button>
            </form>

            <div class="contact-details">
                <div class="contact-detail">
                    <h3 class="contact-detail__label">Email</h3>
                    <a href="mailto:hello@theopening.com.au" class="contact-detail__value" data-underline>hello@theopening.com.au</a>
                </div>
                <div class="contact-detail">
                    <h3 class="contact-detail__label">Phone</h3>
                    <a href="tel:+61730000000" class="contact-detail__value" data-underline>(07) 3000 0000</a>
                </div>
                <div class="contact-detail">
                    <h3 class="contact-detail__label">Location</h3>
                    <p class="contact-detail__value">Brisbane QLD</p>
                </div>
            </div>

        </div>
    </div>
</section>

{% endblock %}
